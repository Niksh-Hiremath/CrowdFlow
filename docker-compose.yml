services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./apps/api/.env
    environment:
      EXTRACT_MODE: ${EXTRACT_MODE:-mock}
      ADVISOR_MODE: ${ADVISOR_MODE:-mock}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_VLM_MODEL: ${HF_VLM_MODEL:-Qwen/Qwen3-VL-8B-Instruct}
      HF_LLM_MODEL: ${HF_LLM_MODEL:-Qwen/Qwen3-4B-Instruct-2507}
    volumes:
      - ./apps/api/data/cache:/app/data/cache
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        API_ORIGIN: http://api:8000
    ports:
      - "3000:3000"
    environment:
      API_ORIGIN: http://api:8000
      NEXT_PUBLIC_API_WS: ws://127.0.0.1:8000/api/sessions/{id}/sim/stream
    depends_on:
      - api
    restart: unless-stopped
